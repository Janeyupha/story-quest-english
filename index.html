<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Quest English</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7EC; --card:#FFFFFF; --ink:#2A2733; --muted:#7A7385; --line:#EFE6D8;
  --coral:#FF6B4A; --coral-d:#E2502F; --teal:#14A39A; --teal-l:#DDF5F2;
  --gold:#FFBE2E; --gold-l:#FFF1CC; --violet:#7B5CFF; --violet-l:#ECE7FF;
  --ok:#1E9E5A; --ok-l:#DFF6E8; --warn:#E58A00; --warn-l:#FFF0D9; --bad:#D9443B;
  --r:18px; --shadow:0 2px 0 rgba(42,39,51,.06),0 8px 24px rgba(42,39,51,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,"Noto Sans Thai",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:14px 14px 80px}
#app{max-width:560px;margin:0 auto}
#app.wide{max-width:920px}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.01em}
h1{font-size:26px} h2{font-size:21px} h3{font-size:17px}
p{margin:.4em 0;line-height:1.5}
.th{font-family:"Noto Sans Thai",Nunito,sans-serif;font-size:13px;color:var(--muted);font-weight:500;display:block;margin-top:2px}
.muted{color:var(--muted)} .small{font-size:13px} .center{text-align:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:12px 0;border:1px solid var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.btn{appearance:none;border:0;border-radius:14px;padding:13px 18px;font:800 16px Nunito,sans-serif;cursor:pointer;background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d);transition:transform .06s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px;position:relative;overflow:hidden}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--coral-d)}
.btn.block{width:100%}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #0E7C75}
.btn.violet{background:var(--violet);box-shadow:0 4px 0 #5A3FD8}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:14px;min-height:38px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.linkbtn{background:none;border:0;color:var(--teal);font:800 14px Nunito,sans-serif;text-decoration:underline;cursor:pointer;position:relative;padding:6px 0}
.linkbtn input[type=file]{position:absolute;inset:0;opacity:0;width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:800;font-size:14px}
.chip.gold{background:var(--gold-l);border-color:#FFE08A}
.chip.coral{background:#FFE5DE;border-color:#FFC4B5}
.chip.violet{background:var(--violet-l);border-color:#D3C8FF}
.chip.teal{background:var(--teal-l);border-color:#A9E6DF}
.bar{height:12px;border-radius:99px;background:#F1E8DA;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--coral));border-radius:99px;transition:width .3s}
.hero{background:linear-gradient(135deg,#FF8A5C,#FF6B4A 55%,#F2557A);color:#fff;border:0}
.hero .th{color:rgba(255,255,255,.85)}
.hero .btn{background:#fff;color:var(--coral-d);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.mission{border:2px solid var(--line)}
.mission.memory{background:var(--violet-l);border-color:#D3C8FF}
.kw{display:inline-block;padding:6px 12px;border-radius:12px;background:var(--gold-l);border:2px solid #FFE08A;font-weight:800;margin:3px 4px 3px 0}
.kw.hit{background:var(--ok-l);border-color:#9BDDB7}
.kw.hit::after{content:" ✓";color:var(--ok)}
textarea,input[type=text],input[type=url],input[type=number],select{width:100%;font:600 17px Nunito,"Noto Sans Thai",sans-serif;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:#FFFDF9;color:var(--ink)}
textarea{min-height:100px;resize:vertical;line-height:1.45}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--teal)}
label.lbl{display:block;font-weight:800;margin:12px 0 6px}
.steps{display:flex;gap:6px;margin:10px 0 4px}
.steps i{flex:1;height:8px;border-radius:9px;background:#F1E8DA}
.steps i.on{background:var(--teal)} .steps i.cur{background:var(--coral)}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;font:700 16px Nunito,sans-serif;margin:7px 0;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--teal);background:var(--teal-l)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--bad);background:#FDE4E2}
.opt[disabled]{cursor:default}
.stat{display:inline-block;background:#FAF4EA;border-radius:12px;padding:8px 12px;margin:4px 6px 4px 0;font-weight:800}
.stat b{font-size:20px;display:block}
.w{display:inline-block;padding:2px 6px;margin:2px;border-radius:7px;font-weight:700}
.w.ok{background:var(--ok-l);color:#11683B}
.w.no{background:var(--warn-l);color:#9A5B00;text-decoration:underline wavy #E58A00}
.node{display:flex;align-items:center;gap:12px;margin:8px 0}
.node:nth-child(even){flex-direction:row-reverse;text-align:right}
.dot{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:0 0 58px;background:#EDE4D6;box-shadow:0 4px 0 #DCCFBC}
.node.done .dot{background:var(--teal);color:#fff;box-shadow:0 4px 0 #0E7C75}
.node.cur .dot{background:var(--coral);color:#fff;box-shadow:0 4px 0 var(--coral-d);animation:pulse 1.6s infinite}
.node .stars{color:var(--gold);font-size:14px;letter-spacing:1px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.badge{text-align:center;padding:10px 6px;border-radius:14px;background:#FAF4EA;font-weight:800;font-size:12px}
.badge .e{font-size:28px;display:block}
.badge.off{opacity:.35;filter:grayscale(1)}
.msg{border-left:5px solid var(--violet);background:#FBFAFF}
.tip{white-space:pre-wrap;line-height:1.5}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,480px);pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:up .25s;text-align:center}
@keyframes up{from{transform:translateY(12px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx span{position:absolute;top:-40px;font-size:28px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.big-msg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);background:#fff;padding:22px 26px;border-radius:22px;font:900 22px Nunito,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,.25);z-index:61;text-align:center;animation:pop .35s;max-width:86vw}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.xpfly{position:fixed;right:22px;top:70px;font:900 24px Nunito,sans-serif;color:var(--gold);text-shadow:0 2px 0 #B98200;z-index:62;animation:xp 1.1s forwards}
@keyframes xp{to{transform:translateY(-50px);opacity:0}}
.tabs{display:flex;gap:6px;margin:12px 0}
.tabs button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font:800 15px Nunito,sans-serif;cursor:pointer;color:var(--ink)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
details summary{cursor:pointer;font-weight:800;color:var(--teal);margin:6px 0}
video.rv{width:100%;max-height:360px;border-radius:14px;background:#000;margin-top:6px}
.pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--warn-l);color:#9A5B00}
.pill.ok{background:var(--ok-l);color:#11683B}
.help{background:var(--teal-l);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:700;margin:8px 0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.x{border:0;background:#fff;border:2px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:20px;cursor:pointer}
hr{border:0;border-top:2px dashed var(--line);margin:14px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
/* player */
.player{position:sticky;top:8px;z-index:20;border:2px solid #A9E6DF;background:#F6FFFD}
.pvwrap{position:relative;border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px}
.pvwrap video{display:block;width:100%;max-height:300px}
.pvwrap.audio{height:0;margin:0;background:none}
.subcover{position:absolute;left:0;right:0;bottom:0;height:24%;background:rgba(20,20,28,.96);color:#aaa;display:grid;place-items:center;font-size:12px;font-weight:700}
.subcover.off{display:none}
.paudio{display:flex;align-items:center;gap:10px;font-weight:800;margin-bottom:8px}
.paudio .wave{font-size:26px}
.prow{display:flex;gap:10px;align-items:center;justify-content:center;margin:4px 0 10px}
.pbtn{border:2px solid var(--line);background:#fff;border-radius:14px;min-width:60px;height:48px;font:900 16px Nunito,sans-serif;cursor:pointer;color:var(--ink)}
.pbtn.play{background:var(--teal);color:#fff;border-color:var(--teal);min-width:84px;height:58px;font-size:24px;border-radius:18px}
.pbar{cursor:pointer}
.pbar>i{background:var(--teal)}
/* worksheet */
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{padding:12px;border-radius:12px;border:2px solid var(--line);background:#fff;font:700 15px Nunito,sans-serif;cursor:pointer;text-align:left;color:var(--ink);min-height:48px}
.mt.sel{border-color:var(--teal);background:var(--teal-l)}
.mt.done{border-color:#9BDDB7;background:var(--ok-l);color:#11683B;cursor:default}
.mt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tok{display:inline-block;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;font:800 16px Nunito,sans-serif;margin:4px;cursor:pointer;color:var(--ink)}
.tok.used{opacity:.25;pointer-events:none}
.built{min-height:56px;border:2px dashed #A9E6DF;border-radius:14px;padding:4px;background:#F6FFFD}
.script{white-space:pre-wrap;line-height:1.6;background:#FFFDF6;border:2px solid var(--gold-l);border-radius:14px;padding:12px;max-height:320px;overflow:auto;font-size:16px}
.rec{border:2px solid #D3C8FF;background:#FCFBFF}
.recok{color:var(--ok);font-weight:800}
.clipbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid #D3C8FF;background:#fff;border-radius:999px;padding:6px 12px;font:800 14px Nunito,sans-serif;cursor:pointer;color:var(--violet);margin:3px 4px 3px 0}

.btn.red{background:#E8453C;box-shadow:0 4px 0 #B32E27}
.recbox{border:2px solid #D3C8FF;background:#FCFBFF;border-radius:14px;padding:12px}
.recbox.on{border-color:#E8453C;background:#FFF1F0;animation:recpulse 1.2s infinite}
@keyframes recpulse{50%{box-shadow:0 0 0 6px rgba(232,69,60,.15)}}
.rectime{font:900 28px Nunito,sans-serif}
</style>
</head>
<body>
<div id="app"><div class="card center"><h2>📚 Story Quest</h2><p class="muted">Loading…</p></div></div>
<div id="toast"></div>
<div id="fx"></div>
<script>
"use strict";
/* ======================================================================
   Story Quest English — app page (works inside Google Apps Script,
   or on any static host with API_URL set to the Apps Script /exec URL)
   ====================================================================== */
const API_URL='https://script.google.com/macros/s/AKfycbyJN-AkrvVlzuFod0MCcqJ18kscQabYm7PIgpPAG414mfY1FlcVDu0R3p97DzrCuQg/exec'; // only needed if this page is hosted outside Google (e.g. GitHub Pages)
const BOOT=(function(){try{const b=JSON.parse(document.getElementById('boot').textContent);if(b&&typeof b==='object')return b;}catch(e){}
  const q=new URLSearchParams(location.search);return{u:q.get('u')||'',t:q.get('t')||'',url:API_URL};})();

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmtD=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fmtD(new Date());
const parseD=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmtD(d);};
const diffDays=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
const isWeekend=s=>{const g=parseD(s).getDay();return g===0||g===6;};
const weekKey=s=>{const d=parseD(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return fmtD(d);};
const maxD=(a,b)=>a>b?a:b;
const fmtS=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+pad(s%60);};
const niceDate=s=>{try{return parseD(s).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}catch(e){return s}};
const norm=s=>String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).map(w=>w.replace(/^'+|'+$/g,'')).filter(Boolean);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const range=n=>Array.from({length:n},(_,i)=>i);
function shuffledIdx(n){if(n<2)return range(n);let o;do{o=shuffle(range(n));}while(o.every((v,i)=>v===i));return o;}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function hasKw(text,kw){const words=norm(text),k=norm(kw);if(!k.length)return false;const stem=w=>w.length>4?w.replace(/(ing|ed|es|s)$/,''):w;
  if(k.length===1){const s=stem(k[0]);return words.some(w=>w===k[0]||(s.length>=3&&stem(w)===s));}return (' '+words.join(' ')+' ').includes(' '+k.join(' ')+' ');}
const shText=x=>typeof x==='string'?x:(x&&x.t)||'';
const mcqToLine=m=>m?[m.q,m.right].concat(m.wrong||[]).join(' | '):'';
function lineToMcq(l){const p=String(l).split('|').map(s=>s.trim());if(p.length<3||!p[0]||!p[1])return null;return{q:p[0],right:p[1],wrong:p.slice(2).filter(Boolean).slice(0,3)};}
const lines=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
function lineToVocab(l){const i=l.indexOf('=');if(i<1)return null;const w=l.slice(0,i).trim(),m=l.slice(i+1).trim();return w&&m?{w,m}:null;}
function lineToGap(l){const p=l.split('|').map(s=>s.trim());if(p.length<2||!p[0].includes('___')||!p[1])return null;return{s:p[0],a:p[1]};}
const lvlXP=l=>50*l*(l+1)-100;
function levelOf(xp){let l=1;while(xp>=lvlXP(l+1))l++;return l;}
const rankOf=l=>l>=7?'Storyteller':l>=4?'Speaker':'Listener';
const REVIEW_OFFSETS=[0,3,7,21];
const LIMS={g:30,r1:90,r2:60,r3:45,b:45,a:45};
const RNAME={g:'My guess',r1:'Retell round 1',r2:'Retell round 2',r3:'Retell round 3',b:'From memory',a:'After listening'};
const slotName=s=>RNAME[s]||(s.startsWith('sh')?'Sentence '+(+s.slice(2)+1):s);
const BADGES={
  first:{e:'🌱',n:'First Story',d:'Finish your first story'},
  retell:{e:'🗣️',n:'Storyteller',d:'Record all 3 retell rounds'},
  ears:{e:'👂',n:'Good Ears',d:'Listen to yourself every time'},
  quiz:{e:'💯',n:'Quiz Star',d:'Get every quiz question right'},
  sheet:{e:'📝',n:'Sheet Pro',d:'Perfect practice sheet'},
  memory:{e:'🧠',n:'Memory Starter',d:'Finish your first memory review'},
  memory5:{e:'🏆',n:'Memory Master',d:'Finish 5 memory reviews'},
  s3:{e:'🔥',n:'3-Day Streak',d:'Practise 3 days in a row'},
  s7:{e:'🌟',n:'7-Day Streak',d:'Practise 7 days in a row'},
  rec20:{e:'🎙️',n:'Voice Builder',d:'Make 20 recordings'},
  l5:{e:'🗺️',n:'Explorer',d:'Finish 5 stories'},
  l10:{e:'👑',n:'Adventurer',d:'Finish 10 stories'}
};
const STEPS=[['Guess the topic','ดูรูปและชื่อเรื่อง แล้วอัดเสียงเดาว่าจะพูดเรื่องอะไร'],['Main idea','ฟังจับใจความหลัก'],['Quiz','ฟังอีกครั้งแล้วทำแบบทดสอบ'],['Practice sheet','แบบฝึกหัด: คำศัพท์ เติมคำ เรียงประโยค'],['Shadowing','ฟังต้นฉบับ → อัดเสียง → ฟังเสียงตัวเอง'],['Retell','เล่าเรื่องด้วยคำพูดของตัวเอง 3 รอบ'],['Quick log','บันทึกสั้นๆ']];
const DEF=()=>({xp:0,streak:0,best:0,last:null,rest:{week:null,used:0},badges:[],done:{},reviews:[],recallDay:{date:null,n:0},recalls:0,lessons:0,recs:0,lastLesson:null});

/* ---------- server calls ---------- */
function call(fn,...args){
  if(window.__MOCK__)return window.__MOCK__(fn,args);
  if(window.google&&google.script&&google.script.run)return new Promise((res,rej)=>google.script.run.withSuccessHandler(r=>r&&r.ok?res(r.data):rej(new Error((r&&r.error)||'Server error'))).withFailureHandler(e=>rej(e instanceof Error?e:new Error(String(e)))).api(fn,args));
  if(!BOOT.url)return Promise.reject(new Error('API_URL is not set'));
  return fetch(BOOT.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn,args})}).then(r=>r.json()).then(r=>{if(!r.ok)throw new Error(r.error);return r.data;});
}
const tcall=(fn,...args)=>call(fn,S.pin,...args);
function toB64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=rej;r.readAsDataURL(blob);});}
const fileCache={},fileLoading={};
function fileURL(id){if(!id)return Promise.reject(new Error('no file'));if(fileCache[id])return Promise.resolve(fileCache[id]);
  if(!fileLoading[id])fileLoading[id]=call('file',id).then(f=>{const bin=atob(f.b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return(fileCache[id]=URL.createObjectURL(new Blob([u],{type:f.mime})));}).finally(()=>{delete fileLoading[id];});
  return fileLoading[id];}
/* images/videos in the page: <img data-fid="..."> gets its src after render */
function hydrate(){document.querySelectorAll('[data-fid]').forEach(el=>{const id=el.dataset.fid;if(el.dataset.done===id)return;el.dataset.done=id;fileURL(id).then(u=>{el.src=u;}).catch(()=>{});});}

/* ---------- state ---------- */
const S={view:'loading',u:BOOT.u,teacher:!!BOOT.t,lessons:[],me:null,st:null,myAtt:[],students:[],selStu:null,stuAtt:[],tab:'students',flow:null,edit:null,filter:'needs',drafts:{},busy:{},confirm:null,pin:''};
const lesson=id=>S.lessons.find(l=>l.id===id)||{title:'(removed story)',keywords:[],shadow:[],quiz:[],vocab:[],gaps:[],orders:[]};

/* ---------- feedback effects ---------- */
function toast(t,ms){const d=document.createElement('div');d.textContent=t;$('#toast').appendChild(d);setTimeout(()=>d.remove(),ms||2800);}
function confetti(){const fx=$('#fx');const em=['🎉','⭐','✨','🌟','💛','🧡'];for(let i=0;i<26;i++){const s=document.createElement('span');s.textContent=em[i%em.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=(Math.random()*.5)+'s';fx.appendChild(s);setTimeout(()=>s.remove(),2600);}}
function celebrate(t){confetti();const d=document.createElement('div');d.className='big-msg';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1900);}
function flyXP(n){if(!n)return;const d=document.createElement('div');d.className='xpfly';d.textContent='+'+n+' XP';document.body.appendChild(d);setTimeout(()=>d.remove(),1200);}

/* ---------- saving (queued) ---------- */
let stQ=Promise.resolve(),stTimer=null,atTimer=null,atQ=Promise.resolve();
function saveState(){clearTimeout(stTimer);stTimer=setTimeout(()=>{const snap=JSON.parse(JSON.stringify(S.st));stQ=stQ.then(()=>call('saveState',S.u,snap)).catch(e=>{console.error(e);toast('⚠️ Could not save. Check your internet.');});},400);}
function attSnapshot(a){const c=JSON.parse(JSON.stringify(a));delete c.t;return c;}
function saveAtt(now){if(!S.flow||!S.flow.att)return;clearTimeout(atTimer);const go=()=>{const snap=attSnapshot(S.flow.att);atQ=atQ.then(()=>call('saveAttempt',S.u,snap)).catch(e=>{console.error(e);toast('⚠️ Could not save your practice.');});return atQ;};if(now)return go();atTimer=setTimeout(go,700);}
function attUpd(p){if(!S.flow)return;Object.assign(S.flow.att,p);saveAtt();}
function touchDay(){
  const st=S.st,t=today();if(st.last===t)return;
  let streak=st.streak||0,rest=Object.assign({week:null,used:0},st.rest||{});const wk=weekKey(t);
  if(rest.week!==wk)rest={week:wk,used:0};
  if(!st.last)streak=1;else{const gap=diffDays(st.last,t)-1;if(gap<=0)streak+=1;else if(gap<=2-rest.used){rest.used+=gap;streak+=1;setTimeout(()=>toast('😴 Rest day used. Your streak is safe!'),400);}else streak=1;}
  Object.assign(st,{last:t,streak,best:Math.max(st.best||0,streak),rest});
}
function checkBadges(st){const have=new Set(st.badges||[]),add=[];const g=k=>{if(!have.has(k)){have.add(k);add.push(k);}};
  if(st.streak>=3)g('s3');if(st.streak>=7)g('s7');if(st.lessons>=5)g('l5');if(st.lessons>=10)g('l10');if(st.recalls>=1)g('memory');if(st.recalls>=5)g('memory5');if(st.recs>=20)g('rec20');return add;}
function award(n,patch,extra){
  const st=S.st;if(!st)return;const before=levelOf(st.xp||0);touchDay();Object.assign(st,patch||{});st.xp=(st.xp||0)+n;
  const have=new Set(st.badges||[]),nb=[];(extra||[]).forEach(k=>{if(!have.has(k)){have.add(k);nb.push(k);}});st.badges=[...(st.badges||[]),...nb];
  checkBadges(st).forEach(k=>{nb.push(k);st.badges.push(k);});saveState();flyXP(n);
  const after=levelOf(st.xp);if(after>before)setTimeout(()=>celebrate('⬆️ Level '+after+' · '+rankOf(after)+'!'),300);
  nb.forEach((b,i)=>setTimeout(()=>celebrate(BADGES[b].e+' New badge: '+BADGES[b].n),900+i*2000));
}
const LK=()=>'sqg-flow-'+S.u;
function saveFlowLocal(){try{if(!S.flow)return;const f=JSON.parse(JSON.stringify(S.flow,(k,v)=>k==='url'||k==='blob'?undefined:v));localStorage.setItem(LK(),JSON.stringify({d:today(),f}));}catch(e){}}
function clearFlow(){S.flow=null;try{localStorage.removeItem(LK());}catch(e){}}
function restoreFlow(){try{const o=JSON.parse(localStorage.getItem(LK())||'null');if(o&&o.d===today()&&o.f){S.flow=o.f;Object.keys(S.flow.rec||{}).forEach(k=>{const r=S.flow.rec[k];if(!r.fileId)delete S.flow.rec[k];else{r.saving=false;}});}}catch(e){}}

/* ---------- microphone recording ---------- */
const REC={stream:null,mr:null,chunks:[],slot:null,start:0,lim:0,timer:null,onDone:null};
function pickMime(){const c=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];for(const m of c){try{if(window.MediaRecorder&&MediaRecorder.isTypeSupported(m))return m;}catch(e){}}return '';}
const extOf=m=>/mp4|m4a|aac/.test(m)?'.m4a':/webm/.test(m)?'.webm':/ogg/.test(m)?'.ogg':'.audio';
async function recStart(slot,lim,onDone){
  if(REC.mr)return;
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('This browser cannot record. Please open the link in Safari or Chrome.',4500);return;}
  stopAllAudio();
  try{REC.stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});}
  catch(e){console.error(e);toast('Please allow the microphone 🎤 (check your browser settings)',4500);return;}
  const mime=pickMime();let mr;try{mr=new MediaRecorder(REC.stream,mime?{mimeType:mime}:undefined);}catch(e){mr=new MediaRecorder(REC.stream);}
  Object.assign(REC,{mr,chunks:[],slot,start:Date.now(),lim:lim||0,onDone});
  mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
  mr.onstop=()=>{const type=mr.mimeType||mime||'audio/mp4';const blob=new Blob(REC.chunks,{type});const dur=Math.max(1,Math.round((Date.now()-REC.start)/1000));const cb=REC.onDone;
    clearInterval(REC.timer);REC.mr=null;REC.slot=null;releaseMic();render();if(cb)cb(blob,dur,type);};
  mr.start(1000);clearInterval(REC.timer);REC.timer=setInterval(recTick,250);render();
}
function recTick(){const el=document.getElementById('rectime');const s=Math.floor((Date.now()-REC.start)/1000);
  if(REC.lim){const left=REC.lim-s;if(el){el.textContent=left>=0?fmtS(left):'+'+fmtS(-left);el.style.color=left<0?'var(--bad)':'';}if(left===0&&!REC.beeped){REC.beeped=1;toast('⏰ Time! Finish your sentence.');}if(left<=-15)recStop();}
  else{if(el)el.textContent=fmtS(s);if(s>=180)recStop();}}
function recStop(){REC.beeped=0;if(REC.mr&&REC.mr.state!=='inactive')REC.mr.stop();}
function releaseMic(){if(REC.stream){REC.stream.getTracks().forEach(t=>t.stop());REC.stream=null;}}

TA.addEventListener('ended',()=>{TAkey=null;render();});TA.addEventListener('pause',()=>render());
function stopAllAudio(){try{TA.pause();}catch(e){}if(P.v&&!P.v.paused)P.v.pause();}

/* ---------- lesson player (persistent element) ---------- */
const P={box:null,v:null,id:null,stopAt:null};
function buildPlayer(){

  box.innerHTML=`<div class="pvwrap audio"><video playsinline preload="auto"></video><div class="subcover">subtitles hidden</div></div>
  <div class="paudio"><span class="wave">🎧</span><span class="ptitle grow"></span><span class="plist chip teal" style="font-size:12px">0×</span></div>
  <div class="prow"><button class="pbtn" data-p="back">⟲ 5s</button><button class="pbtn play" data-p="play">▶</button><button class="pbtn" data-p="rate">1×</button></div>
  <div class="bar pbar"><i></i></div><div class="row between small muted" style="margin-top:4px"><span class="ptime">0:00 / 0:00</span><label class="pcov" style="display:none"><input type="checkbox"> hide subtitles</label></div>`;
  const v=box.querySelector('video');P.box=box;P.v=v;
  const pb=box.querySelector('.pbar>i'),pt=box.querySelector('.ptime'),play=box.querySelector('.play'),rate=box.querySelector('[data-p=rate]');
  const upd=()=>{const d=v.duration||0;pb.style.width=(d&&isFinite(d)?100*v.currentTime/d:0)+'%';pt.textContent=fmtS(v.currentTime)+' / '+fmtS(isFinite(d)?d:0);if(P.stopAt!=null&&v.currentTime>=P.stopAt){P.stopAt=null;v.pause();}};
  v.addEventListener('timeupdate',upd);v.addEventListener('loadedmetadata',upd);
  v.addEventListener('play',()=>{play.textContent='⏸';try{TA.pause();}catch(e){}});v.addEventListener('pause',()=>{play.textContent='▶';});
  v.addEventListener('ended',()=>{play.textContent='▶';if(S.flow){S.flow.listens=(S.flow.listens||0)+1;box.querySelector('.plist').textContent=S.flow.listens+'×';attUpd({listens:S.flow.listens});saveFlowLocal();toast('🎧 Listened '+S.flow.listens+(S.flow.listens>1?' times':' time')+'!');}});
  box.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const k=b.dataset.p;
    if(k==='play'){P.stopAt=null;if(v.paused)v.play().catch(()=>toast('Tap ▶ again'));else v.pause();}
    if(k==='back')v.currentTime=Math.max(0,v.currentTime-5);
    if(k==='rate'){v.playbackRate=v.playbackRate===1?0.75:1;rate.textContent=v.playbackRate===1?'1×':'0.75×';}});
  box.querySelector('.pbar').addEventListener('click',e=>{const r=e.currentTarget.getBoundingClientRect();if(v.duration)v.currentTime=v.duration*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));});
  box.querySelector('.pcov input').addEventListener('change',e=>box.querySelector('.subcover').classList.toggle('off',!e.target.checked));
}
async function setPlayer(key,media,title){

async function onRecorded(slot,blob,dur,mime){

}
async function uploadRec(slot){
  const f=S.flow,r=f.rec[slot];if(!r||!r.blob)return;r.saving=true;r.err=false;render();
  try{const b64=await toB64(r.blob);const id=await call('upload',S.u,b64,r.mime,f.att.id+'-'+slot+'-'+r.takes+extOf(r.mime));

function vMsg(a){const t=a.t||{};let h=`<div class="card msg"><div class="small muted">${esc(a.title||'')} · ${esc(niceDate(a.date||today()))}</div>`;

/* ---------- shared pieces ---------- */
const pslot=()=>'<div id="pslot"></div>';
function kwChips(kws){return (kws||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join('');}
function flowTop(title,n,cur){return `<div class="topbar"><button class="x" data-a="exitFlow" aria-label="Close">✕</button><div class="grow center"><b>${esc(title)}</b></div><span class="chip gold">⭐ ${S.st?S.st.xp:0}</span></div>${n?`<div class="steps">${range(n).map(i=>`<i class="${i<cur?'on':i===cur?'cur':''}"></i>`).join('')}</div>`:''}`;}
function mcqHtml(key,m,ord,pick){const opts=[m.right].concat(m.wrong||[]);return ord.map(oi=>{let c='';if(pick!=null){if(oi===0)c='right';else if(oi===pick)c='wrong';}return `<button class="opt ${c}" data-a="mcq" data-k="${key}" data-o="${oi}" ${pick!=null?'disabled':''}>${esc(opts[oi])}</button>`;}).join('');}
const heardAll=slots=>slots.every(s=>{const r=myRec(s);return r&&r.heard&&r.fileId;});

/* ---------- lesson flow ---------- */
function newLessonFlow(L,attId){
  const f={type:'lesson',lessonId:L.id,step:0,listens:0,rec:{},feel:null,word:'',att:{id:attId,kind:'lesson',lessonId:L.id,title:L.title,date:today(),createdAt:Date.now(),status:'started',rec:{}}};
  if(L.gist&&L.gist.right)f.gistOrd=shuffle(range(1+(L.gist.wrong||[]).length));
  f.quizOrd=(L.quiz||[]).map(q=>shuffle(range(1+(q.wrong||[]).length)));f.quizPick=(L.quiz||[]).map(()=>null);
  f.vOrd=shuffledIdx((L.vocab||[]).length);f.v={sel:null,done:{},miss:{}};
  const bank=(L.gaps||[]).map(g=>g.a);f.gapBank=shuffle(bank.concat((L.keywords||[]).filter(k=>!bank.includes(k)&&norm(k).length===1).slice(0,1)));f.gapAns=(L.gaps||[]).map(()=>'');
  f.ordTok=(L.orders||[]).map(s=>shuffledIdx(s.split(/\s+/).filter(Boolean).length));f.ordBuilt=(L.orders||[]).map(()=>[]);
  return f;
}
function vLesson(){

  if(s===0){
    h+=`<div class="card">${imgTag(L,'margin-bottom:10px')}<h2>“${esc(L.title)}”</h2><p>Look at the picture and the title. What will the speaker talk about? Say 1–2 ideas.</p><div class="small" style="font-weight:800">Example: <i>“I think she will talk about her name and her family.”</i></div></div>
    <div class="card rec">${vRec('g','Record my guess')}</div><button class="btn block" data-a="next" ${heardAll(['g'])?'':'disabled'}>Next →</button>${myRec('g')&&!heardAll(['g'])?'<p class="small muted center">Listen to your recording first 👂</p>':''}`;
  }else if(s===1){
    h+=`<div class="card"><p>Listen <b>one time</b>. Just listen for the main idea. Don't worry about every word!</p><span class="th">ฟัง 1 รอบ ฟังแค่ใจความหลัก</span></div>`+pslot();
    if(L.gist&&L.gist.right)h+=`<div class="card"><h3>${esc(L.gist.q||'What is it mostly about?')}</h3>${L.gist.qTh?`<span class="th">${esc(L.gist.qTh)}</span>`:''}${mcqHtml('gist',L.gist,f.gistOrd,f.gist)}${f.gist!=null?`<p><b>${f.gist===0?'✅ Great listening!':'👍 Good try! You will hear it again next.'}</b></p>`:''}</div>`;
    h+=`<button class="btn block" data-a="next" ${L.gist&&L.gist.right&&f.gist==null?'disabled':''}>Next →</button>`;
  }else if(s===2){

    if(L.script&&(all||!Q.length))h+=f.showScript?`<div class="card"><h3>📜 Script</h3><p class="small muted">Listen and read together one time.<span class="th">ฟังพร้อมอ่านสคริปต์ 1 รอบ</span></p><div class="script">${esc(L.script)}</div></div>`:`<button class="btn ghost block" data-a="showScript">📜 Show the script</button>`;
    h+=`<div style="height:10px"></div><button class="btn block" data-a="next" ${Q.length&&!all?'disabled':''}>Next →</button>`;
  }else if(s===3){h+=vSheet(L,f);}

    const sh=L.shadow||[],slots=sh.map((_,i)=>'sh'+i);

    h+=sh.map((x,i)=>{const seg=typeof x==='object'?x:null;return `<div class="card rec"><div class="small muted" style="font-weight:800">SENTENCE ${i+1}</div><p style="font-size:19px;font-weight:800;margin:4px 0 10px">${esc(shText(x))}</p>
      ${seg&&seg.s!=null?`<button class="btn teal sm" data-a="model" data-i="${i}">▶ Listen to the speaker</button>`:'<p class="small muted">Find this sentence in the audio above.</p>'}<div style="height:8px"></div>${vRec('sh'+i,'Record')}</div>`;}).join('');
    if(!sh.length)h+=`<div class="card muted">(No shadowing sentences in this lesson.)</div>`;
    h+=`<button class="btn block" data-a="next" ${heardAll(slots)?'':'disabled'}>Next →</button>${sh.length&&!heardAll(slots)?'<p class="small muted center">Record every sentence and listen to yourself 👂</p>':''}`;
  }else if(s===5){
    const ok=k=>heardAll([k]);

    <label class="lbl">Use these words:</label><div>${kwChips(L.keywords)}</div><label class="lbl">Helpers:</label><div class="small" style="font-weight:700">First, … · Then, … · After that, … · In the end, …<br>The speaker is … · He / She likes … · I think …</div></div>`;
    ['r1','r2','r3'].forEach((k,i)=>{if(i>0&&!ok(['r1','r2','r3'][i-1]))return;h+=`<div class="card rec"><div class="row between"><h3>Round ${i+1}</h3><span class="chip">⏱️ ${LIMS[k]} sec</span></div><div style="height:8px"></div>${vRec(k,'Record round '+(i+1))}</div>`;});
    if(ok('r3')){const d=['r1','r2','r3'].map(k=>myRec(k).dur);h+=`<div class="card"><h3>👂 Compare round 1 and round 3</h3><p class="small">Round 1: <b>${d[0]}s</b> → Round 3: <b>${d[2]}s</b>. Listen to both. Is round 3 smoother?</p><span class="th">ฟังรอบ 1 กับรอบ 3 เทียบกัน รอบ 3 ลื่นขึ้นไหม</span></div>`;}
    h+=`<button class="btn block" data-a="next" ${ok('r1')&&ok('r2')&&ok('r3')?'':'disabled'}>Next →</button>`;
  }else if(s===6){
    h+=`<div class="card"><h3>How much did you understand?</h3><span class="th">วันนี้เข้าใจมากแค่ไหน</span><div class="row" style="margin-top:10px">${[['😀','Most'],['🙂','Some'],['😐','A little']].map(([e,t])=>`<button class="opt ${f.feel===e?'sel':''}" style="flex:1;text-align:center;font-size:26px" data-a="feel" data-v="${e}">${e}<div style="font-size:13px">${t}</div></button>`).join('')}</div>
    <label class="lbl">What will you do better next time? <span class="th" style="display:inline">ครั้งหน้าจะพูดให้ดีขึ้นตรงไหน</span></label><input type="text" data-b="f.better" value="${esc(f.better||'')}" placeholder="e.g. say 'teacher' clearly">
    <label class="lbl">One new word or phrase I learned <span class="th" style="display:inline">คำใหม่ 1 คำ</span></label><input type="text" data-b="f.word" value="${esc(f.word||'')}" placeholder="e.g. hang out"></div>
    <button class="btn block" data-a="finishLesson" ${f.feel?'':'disabled'}>🏁 Finish & send to teacher</button>`;
  }
  return h;
}
function vSheet(L,f){
  const V=L.vocab||[],G=L.gaps||[],O=L.orders||[];
  if(!V.length&&!G.length&&!O.length)return `<div class="card muted">(No practice sheet in this lesson yet.)</div><button class="btn block" data-a="next">Next →</button>`;
  let h='';const done=f.wsChecked;
  if(V.length)h+=`<div class="card"><h3>A. Match the words</h3><span class="th">แตะคำ แล้วแตะความหมาย</span><div class="match" style="margin-top:10px"><div>${V.map((v,i)=>`<button class="mt ${f.v.done[i]?'done':f.v.sel===i?'sel':''}" data-a="vw" data-i="${i}" ${f.v.done[i]?'disabled':''}>${esc(v.w)}</button>`).join('<div style="height:8px"></div>')}</div><div>${f.vOrd.map(i=>`<button class="mt ${f.v.done[i]?'done':''}" id="vm${i}" data-a="vm" data-i="${i}" ${f.v.done[i]?'disabled':''}>${esc(V[i].m)}</button>`).join('<div style="height:8px"></div>')}</div></div></div>`;
  if(G.length)h+=`<div class="card"><h3>B. Fill in the blank</h3><span class="th">เลือกคำมาเติมในช่องว่าง</span>`+G.map((g,i)=>{const parts=g.s.split('___'),a=f.gapAns[i],res=done?(norm(a).join(' ')===norm(g.a).join(' ')?'right':'wrong'):'';
    return `<div style="margin:12px 0;font-size:17px;font-weight:700;line-height:2">${i+1}. ${esc(parts[0])}<select data-b="f.gapAns.${i}" style="width:auto;display:inline-block;padding:6px 10px;font-size:16px;${res==='right'?'border-color:var(--ok);background:var(--ok-l)':res==='wrong'?'border-color:var(--bad);background:#FDE4E2':''}" ${done?'disabled':''}><option value="">…</option>${f.gapBank.map(w=>`<option ${a===w?'selected':''}>${esc(w)}</option>`).join('')}</select>${esc(parts.slice(1).join('___'))}${res==='wrong'?` <span class="small" style="color:var(--ok)">→ ${esc(g.a)}</span>`:''}</div>`;}).join('')+`</div>`;
  if(O.length)h+=`<div class="card"><h3>C. Put the words in order</h3><span class="th">แตะคำตามลำดับให้เป็นประโยค</span>`+O.map((s,i)=>{const w=s.split(/\s+/).filter(Boolean),b=f.ordBuilt[i]||[],used=new Set(b),ok=done?(b.map(k=>w[k]).join(' ')===w.join(' ')):null;
    return `<div style="margin:12px 0"><div class="built" style="${ok===true?'border-color:var(--ok);background:var(--ok-l)':ok===false?'border-color:var(--bad);background:#FDE4E2':''}">${b.map((k,j)=>`<button class="tok" data-a="ordRm" data-i="${i}" data-j="${j}" ${done?'disabled':''}>${esc(w[k])}</button>`).join('')||'<span class="small muted" style="padding:10px;display:inline-block">Tap the words below…</span>'}</div><div style="margin-top:6px">${f.ordTok[i].map(k=>`<button class="tok ${used.has(k)?'used':''}" data-a="ordAdd" data-i="${i}" data-k="${k}" ${done?'disabled':''}>${esc(w[k])}</button>`).join('')}</div>${ok===false?`<p class="small" style="color:var(--ok)">→ ${esc(s)}</p>`:''}</div>`;}).join('')+`</div>`;
  const vDone=V.length===Object.keys(f.v.done).length;
  if(!done)h+=`<button class="btn teal block" data-a="wsCheck" ${V.length&&!vDone?'disabled':''}>✓ Check my sheet</button>${V.length&&!vDone?'<p class="small muted center">Finish the matching first.</p>':''}`;
  else h+=`<div class="card center"><h2>${f.wsScore.s===f.wsScore.t?'🏆':'⭐'} ${f.wsScore.s} / ${f.wsScore.t}</h2></div><button class="btn block" data-a="next">Next →</button>`;
  return h;
}

function vRecall(){

    if(heardAll(['a']))h+=`<div class="card"><h3>👂 Before and after</h3><div class="row"><button class="clipbtn" data-a="playMine" data-s="b">▶ From memory (${myRec('b').dur}s)</button><button class="clipbtn" data-a="playMine" data-s="a">▶ After listening (${myRec('a').dur}s)</button></div></div>`;

function progressRows(atts){return atts.filter(a=>a.kind==='lesson'&&a.status==='done').slice().sort((x,y)=>(x.createdAt||0)-(y.createdAt||0)).map(a=>{const r=a.rec||{};return{title:a.title,date:a.date,listens:a.listens||0,quiz:a.quiz?Math.round(100*a.quiz.s/Math.max(1,a.quiz.t)):null,ws:a.ws?Math.round(100*a.ws.s/Math.max(1,a.ws.t)):null,recs:Object.keys(r).length,takes:Object.values(r).reduce((s,x)=>s+(x.takes||1),0),d1:r.r1&&r.r1.dur,d3:r.r3&&r.r3.dur,sent:!!(a.t&&a.t.sent)};});}
function vProgress(atts){const rows=progressRows(atts);if(!rows.length)return '';const pc=v=>v==null?'—':v+'%';

function packet(a){const L=lesson(a.lessonId),t=a.t||{},dk=S.drafts['n'+a.id]!=null?S.drafts['n'+a.id]:(t.notes||'');

  if(!patch.feedback&&!patch.comment&&!patch.voice&&!(a.t&&a.t.voice)){toast('Add feedback, a comment or a voice message first');return;}
  S.busy['s'+id]=1;render();try{a.t=await tcall('tPatchAttempt',id,patch);['n','f','c'].forEach(k=>delete S.drafts[k+id]);if(S.tv)delete S.tv[id];toast('📤 Sent! She will see it in her app.');}catch(e){toast(e.message);}S.busy['s'+id]=0;render();};
function editFromLesson(l){const sh=l.shadow||[];return{id:l.id,title:l.title||'',order:String(l.order||''),media:l.media||null,image:l.image||null,subs:!!(l.media&&l.media.subs),script:l.script||'',gist:l.gist?mcqToLine(l.gist):'',gistTh:(l.gist&&l.gist.qTh)||'',quiz:(l.quiz||[]).map(mcqToLine).join('\n'),vocab:(l.vocab||[]).map(v=>v.w+' = '+v.m).join('\n'),gaps:(l.gaps||[]).map(x=>x.s+' | '+x.a).join('\n'),orders:(l.orders||[]).join('\n'),keywords:(l.keywords||[]).join(', '),shadow:sh.map(shText).join('\n'),times:sh.map(x=>typeof x==='object'?{s:x.s,e:x.e}:{})};}
A.newLesson=()=>{const mx=S.lessons.reduce((m,l)=>Math.max(m,+l.order||0),0);S.edit={id:'L'+uid(),isNew:true,order:String(mx+1),times:[]};P.id=null;render();scrollTo(0,0);};
A.editLesson=({id})=>{const l=lesson(id);S.edit=editFromLesson(l);P.id=null;setPlayer('edit:'+l.id,l.media,l.title);render();scrollTo(0,0);};
A.cancelEdit=()=>{S.edit=null;stopAllAudio();render();};
A.delLesson=async({id})=>{if(S.confirm!==id){S.confirm=id;render();setTimeout(()=>{if(S.confirm===id){S.confirm=null;rr();}},4000);return;}S.confirm=null;try{await tcall('tDeleteLesson',id);S.lessons=S.lessons.filter(l=>l.id!==id);toast('Deleted');}catch(e){toast(e.message);}render();};
A.setT=({i,w})=>{if(!P.v||!S.edit)return;const e=S.edit;e.times=e.times||[];const tm=e.times[+i]=e.times[+i]||{};tm[w]=Math.round(P.v.currentTime*10)/10;if(w==='s'&&tm.e!=null&&tm.e<=tm.s)tm.e=null;render();};
A.testT=({i})=>{const tm=(S.edit.times||[])[+i];if(tm)playSegment(tm);};
A.copyLessonReq=()=>{const e=S.edit;if(!(e.script||'').trim()){toast('Paste the script first');return;}
  copyText('STORY QUEST — LESSON REQUEST\nPlease make a Story Quest lesson (use the Story Quest lesson format). Reply with ONLY the JSON.\nLevel: adult learner, CEFR A1–A2.\nTitle: '+(e.title||'')+'\n\nScript:\n'+e.script);};
A.applyPaste=()=>{const e=S.edit,raw=String(e.paste||'');const m=raw.match(/\{[\s\S]*\}/);if(!m){toast('I could not find JSON in the pasted text');return;}
  let v;try{v=JSON.parse(m[0]);}catch(err){toast('The pasted JSON has a mistake. Ask Claude again.');return;}
  const arr=x=>Array.isArray(x)?x:[];if(v.title&&!e.title)e.title=String(v.title);
  if(v.gist&&v.gist.q){e.gist=mcqToLine({q:v.gist.q,right:v.gist.right,wrong:arr(v.gist.wrong)});e.gistTh=String(v.gist.qTh||'');}
  e.quiz=arr(v.quiz).filter(q=>q&&q.q&&q.right).map(q=>mcqToLine({q:q.q,right:q.right,wrong:arr(q.wrong)})).join('\n');
  e.vocab=arr(v.vocab).filter(x=>x&&x.w&&x.m).map(x=>x.w+' = '+x.m).join('\n');
  e.gaps=arr(v.gaps).filter(x=>x&&x.s&&x.a&&String(x.s).includes('___')).map(x=>x.s+' | '+x.a).join('\n');
  e.orders=arr(v.orders).map(String).join('\n');e.keywords=arr(v.keywords).join(', ');e.shadow=arr(v.shadow).map(String).join('\n');e.times=[];e.paste='';
  toast('✨ Filled in! Check it, set sentence times, then Save.',4000);render();};
A.saveLesson=async()=>{
  const e=S.edit;if(!(e.title||'').trim()){toast('Please add a title');return;}
  const mx=S.lessons.reduce((m,l)=>Math.max(m,+l.order||0),0),g=lineToMcq(e.gist||'');if(g)g.qTh=(e.gistTh||'').trim();
  const sh=lines(e.shadow).slice(0,4).map((t,i)=>{const tm=(e.times||[])[i]||{};return{t,s:tm.s!=null?tm.s:null,e:tm.e!=null?tm.e:null};});
  const L={id:e.id,title:e.title.trim(),order:+e.order||mx+1,media:e.media?Object.assign({},e.media,{subs:!!e.subs}):null,image:e.image||null,script:(e.script||'').trim(),gist:g,
    quiz:lines(e.quiz).map(lineToMcq).filter(Boolean).slice(0,8),vocab:lines(e.vocab).map(lineToVocab).filter(Boolean).slice(0,8),gaps:lines(e.gaps).map(lineToGap).filter(Boolean).slice(0,6),orders:lines(e.orders).slice(0,3),
    keywords:(e.keywords||'').split(',').map(s=>s.trim()).filter(Boolean).slice(0,6),shadow:sh};
  S.busy.save=1;render();
  try{await tcall('tSaveLesson',L);const i=S.lessons.findIndex(x=>x.id===L.id);if(i>=0)S.lessons[i]=L;else S.lessons.push(L);S.lessons.sort((a,b)=>(a.order||0)-(b.order||0));S.edit=null;stopAllAudio();toast('✓ Lesson saved');}
  catch(err){toast(err.message,4000);}S.busy.save=0;render();};
async function handleMedia(file){const e=S.edit;if(!e)return;if(file.size>25*1024*1024){toast('File is over 25 MB. Please make it smaller.',4000);return;}
  S.busy.media=1;render();
  try{const b64=await toB64(file);const mime=file.type||(/\.mp3$/i.test(file.name)?'audio/mpeg':'video/mp4');const id=await tcall('tUpload',b64,mime,file.name,'media');
    fileCache[id]=URL.createObjectURL(file);e.media={fileId:id,mime};
    if(/video/.test(mime)&&!e.image){try{const jpg=await grabFrame(file,3);if(jpg){const ib=await toB64(jpg);const iid=await tcall('tUpload',ib,'image/jpeg','cover-'+e.id+'.jpg','media');fileCache[iid]=URL.createObjectURL(jpg);e.image={fileId:iid};}}catch(err){console.error(err);}}
    P.id=null;setPlayer('edit:'+e.id,e.media,e.title);toast('✓ Uploaded. Remember to Save.');}
  catch(err){toast('Upload failed: '+err.message,4000);}S.busy.media=0;render();}
async function handleImage(file){const e=S.edit;if(!e)return;S.busy.img=1;render();
  try{const b64=await toB64(file);const id=await tcall('tUpload',b64,file.type||'image/jpeg',file.name,'media');fileCache[id]=URL.createObjectURL(file);e.image={fileId:id};toast('✓ Picture added. Remember to Save.');}
  catch(err){toast('Upload failed: '+err.message,4000);}S.busy.img=0;render();}
function grabFrame(file,at){return new Promise(res=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';const u=URL.createObjectURL(file);let done=false;const fin=b=>{if(done)return;done=true;URL.revokeObjectURL(u);res(b);};
  v.onloadedmetadata=()=>{try{v.currentTime=Math.min(at,(v.duration||at*2)/2);}catch(e){fin(null);}};
  v.onseeked=()=>{try{const w=640,h=Math.round(w*(v.videoHeight||360)/(v.videoWidth||640));const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(v,0,0,w,h);c.toBlob(b=>fin(b),'image/jpeg',0.8);}catch(e){fin(null);}};
  v.onerror=()=>fin(null);setTimeout(()=>fin(null),8000);v.src=u;});}

/* ---------- events ---------- */
function setIn(obj,path,v){if(!obj)return;let o=obj;for(let i=0;i<path.length-1;i++){const k=path[i];if(o[k]==null||typeof o[k]!=='object')o[k]={};o=o[k];}o[path[path.length-1]]=v;}
function onBind(e){const k=e.target&&e.target.dataset&&e.target.dataset.b;if(!k)return;const parts=k.split('.'),root=parts.shift();
  const obj=root==='f'?S.flow:root==='e'?S.edit:S.drafts;setIn(obj,parts,e.target.type==='checkbox'?e.target.checked:e.target.value);if(root==='f')saveFlowLocal();}
document.addEventListener('input',onBind);
document.addEventListener('change',e=>{onBind(e);const inp=e.target;if(!inp||!inp.dataset)return;const file=inp.files&&inp.files[0];if(inp.dataset.media&&file)handleMedia(file);if(inp.dataset.img&&file)handleImage(file);});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||!$('#app').contains(el))return;const fn=A[el.dataset.a];if(!fn)return;e.preventDefault();try{const r=fn(el.dataset,el,e);if(r&&r.catch)r.catch(err=>{console.error(err);toast('Oops: '+err.message);});}catch(err){console.error(err);toast('Oops, something went wrong.');}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.dataset&&e.target.dataset.b==='d.pin')A.pinGo();});
init();

</script>
